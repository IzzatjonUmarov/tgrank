# Запасной пинг сайта снаружи, если сервер упал или перезапускался.
# Адрес задаётся переменной репозитория SITE_URL (Settings → Secrets and variables → Actions → Variables).
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: vars.SITE_URL != ''
    steps:
      - run: curl -fsS --max-time 90 --retry 3 --retry-delay 20 "${{ vars.SITE_URL }}/healthz"
